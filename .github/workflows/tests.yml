name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # closed-loop v0.1 first, by URL and tag. The same reference is in pyproject.toml.
      - name: Install closed-loop v0.1
        run: pip install "closed-loop @ git+https://github.com/darrshangovender/closed-loop@v0.1.0"
      - name: Install this package
        run: pip install -e ".[dev]"
      - name: ruff
        run: ruff check .
      - name: ruff format
        run: ruff format --check .
      - name: mypy
        run: mypy
      # There is no C-MAPSS data in CI: tests marked "data" are skipped.
      - name: pytest
        run: pytest tests/ -q
      # Needs no data: the ledger chain, the hashes, the registered table, the archived run, and
      # RESULTS.md and the README block against results.json.
      - name: Benchmark check
        run: python benchmarks/run.py --check
